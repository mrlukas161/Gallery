name: Room schémy

# A4: kontrola exportovaných schém Room (app/schemas, room.schemaLocation v app/build.gradle.kts).
# Vygeneruje schémy (len KSP krok, bez celého APK) a porovná ich s commitnutými:
#  - schémy ešte nie sú commitnuté → upozornenie, job prejde; schémy sú v artefakte „room-schemas“;
#  - vygenerované sa líšia od commitnutých → job zlyhá. Buď sa zmenili entity bez novej verzie
#    a migrácie (people.db, faces.db a extras.db sú nenahraditeľné!), alebo pribudla nová verzia
#    a jej JSON treba commitnúť (stiahni artefakt a skopíruj do app/schemas/).

on:
  workflow_dispatch:
  push:
    paths:
      - "app/src/main/kotlin/**"
      - "app/schemas/**"
      - "app/build.gradle.kts"
      - "gradle/libs.versions.toml"
      - ".github/workflows/room-schemas.yml"
  pull_request:
    paths:
      - "app/src/main/kotlin/**"
      - "app/schemas/**"
      - "app/build.gradle.kts"
      - "gradle/libs.versions.toml"

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Room schemas (KSP)
        run: ./gradlew :app:kspFossDebugKotlin --stacktrace

      - name: Upload generated schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

      - name: Compare with committed schemas
        run: |
          if [ -z "$(git ls-files app/schemas)" ]; then
            echo "::warning::Room schémy ešte nie sú commitnuté. Stiahni artefakt room-schemas a commitni ho do app/schemas/."
            exit 0
          fi
          # nové (necommitnuté) súbory schém sa tiež ukážu v diffe
          git add --intent-to-add app/schemas
          if ! git diff --exit-code --stat -- app/schemas; then
            git diff -- app/schemas | head -n 200
            echo "::error::Vygenerované Room schémy sa líšia od commitnutých. Zmena entít potrebuje novú verziu DB a Migration; novú schému commitni z artefaktu room-schemas."
            exit 1
          fi
          echo "Room schémy sedia s commitnutými."
