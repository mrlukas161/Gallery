name: Tváre E – schémy a migračné testy (dočasné)

# DOČASNÉ pre balík E: vygeneruje Room schémy v3 (KSP), spustí unit testy a migračné testy na emulátore
# a výsledky (schémy, XML/HTML výsledky, skrátené logy) pushne do vetvy tvare-E-out. Pred zlúčením zmazať.

on:
  push:
    branches: [tvare-E]

permissions:
  contents: write

concurrency:
  group: tvare-e-ci
  cancel-in-progress: true

jobs:
  tvare-e:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Príprava
        run: |
          chmod +x ./gradlew
          mkdir -p out
          echo "commit ${GITHUB_SHA}" > out/status.txt

      - name: (a) Room schémy (KSP)
        run: |
          set +e
          ./gradlew :app:kspFossDebugKotlin --stacktrace > out/ksp.log 2>&1
          echo "ksp=$?" >> out/status.txt
          mkdir -p out/schemas && cp -r app/schemas/. out/schemas/
          tail -n 400 out/ksp.log > out/ksp-tail.log
          exit 0

      - name: Unit testy
        run: |
          set +e
          ./gradlew :app:testFossDebugUnitTest --stacktrace > out/unit.log 2>&1
          echo "unit=$?" >> out/status.txt
          grep -E "^e: |FAILED|tests completed|BUILD" out/unit.log | head -n 300 > out/unit-summary.log
          mkdir -p out/unit-results
          cp -r app/build/test-results/testFossDebugUnitTest/. out/unit-results/ 2>/dev/null
          exit 0

      - name: Detekt a lint
        run: |
          set +e
          ./gradlew :app:detekt > out/detekt.log 2>&1
          echo "detekt=$?" >> out/status.txt
          ./gradlew :app:lintFossDebug > out/lint.log 2>&1
          echo "lint=$?" >> out/status.txt
          grep -E "Error|error:|warning:|issues" out/lint.log | head -n 200 > out/lint-summary.log
          mkdir -p out/lint && cp app/build/reports/lint-results-fossDebug.* out/lint/ 2>/dev/null
          tail -n 200 out/detekt.log > out/detekt-tail.log
          exit 0

      - name: Zostavenie testovacích APK (x86_64)
        run: |
          set +e
          ./gradlew assembleFossDebug assembleFossDebugAndroidTest -PtestAbi=x86_64 --stacktrace > out/assemble.log 2>&1
          echo "assemble=$?" >> out/status.txt
          grep -E "^e: |error:|FAILED|BUILD" out/assemble.log | head -n 300 > out/assemble-summary.log
          exit 0

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: (b) Migračné testy na emulátore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedFossDebugAndroidTest -PtestAbi=x86_64 --stacktrace > out/connected.log 2>&1; echo "connected=$?" >> out/status.txt

      - name: Výsledky
        if: always()
        run: |
          mkdir -p out/androidTest-results out/androidTest-reports
          cp -r app/build/outputs/androidTest-results/. out/androidTest-results/ 2>/dev/null
          cp -r app/build/reports/androidTests/. out/androidTest-reports/ 2>/dev/null
          [ -f out/connected.log ] && tail -n 400 out/connected.log > out/connected-tail.log
          # veľké logy skrátiť (push cez git)
          for f in out/*.log; do
            case "$f" in *-tail.log|*-summary.log) ;; *) tail -n 3000 "$f" > "$f.tmp" && mv "$f.tmp" "$f" ;; esac
          done
          cat out/status.txt

      - name: Push výsledkov do tvare-E-out
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tvare-E-out
          git rm -rf --cached . >/dev/null
          git add -f out
          git commit -m "Tváre E: schémy a výsledky testov (${GITHUB_SHA})" || true
          git push -f origin tvare-E-out
