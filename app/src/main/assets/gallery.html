<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galéria+</title>
<style>
  :root{
    --bg:#0e0f13; --bg2:#16181f; --fg:#e9edf2; --mut:#9aa3b2;
    --line:#262a33; --accent:#4c8dff; --accent2:#2e6ad1; --danger:#ff5d5d;
    --ok:#3ecf8e; --chip:#20242e; --thumb:130px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  button,input,select{font:inherit;color:inherit}
  button{background:var(--chip);border:1px solid var(--line);border-radius:8px;
    padding:.45rem .7rem;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.pri{background:var(--accent2);border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:default}
  a{color:var(--accent)}

  /* ---- top bar ---- */
  header{
    position:sticky;top:0;z-index:30;display:flex;gap:.6rem;align-items:center;
    padding:.55rem .8rem;background:rgba(14,15,19,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  header h1{font-size:1rem;margin:0;font-weight:600;white-space:nowrap}
  header .count{color:var(--mut);font-size:.82rem}
  header .spacer{flex:1 1 auto}
  header input[type=search]{
    background:var(--bg2);border:1px solid var(--line);border-radius:8px;
    padding:.4rem .6rem;min-width:140px;max-width:260px;flex:1 1 140px}
  .qbox{display:flex;align-items:center;gap:.4rem;color:var(--mut);font-size:.8rem}
  .qbox input[type=range]{width:110px;accent-color:var(--accent)}
  .qval{width:2.6rem;text-align:right;color:var(--fg)}

  /* ---- grid ---- */
  main{padding:.6rem}
  #grid{
    display:grid;gap:6px;
    grid-template-columns:repeat(auto-fill,minmax(var(--thumb),1fr));
  }
  .cell{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:8px;
    background:var(--bg2);cursor:pointer;outline:2px solid transparent;outline-offset:-2px}
  .cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;
    transition:opacity .25s}
  .cell img.on{opacity:1}
  .cell .vid{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);
    border-radius:6px;padding:1px 6px;font-size:.7rem}
  .cell .nm{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:.68rem;
    background:linear-gradient(transparent,rgba(0,0,0,.8));white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;color:#dfe5ee}
  /* compare-mode selection */
  body.cmp .cell{cursor:copy}
  .cell.sel{outline-color:var(--accent)}
  .cell .badge{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;
    background:var(--accent);color:#fff;font-weight:700;display:none;
    align-items:center;justify-content:center;font-size:.8rem}
  .cell.sel .badge{display:flex}

  .empty{color:var(--mut);text-align:center;padding:3rem 1rem}

  /* ---- lightbox (single) ---- */
  .ov{position:fixed;inset:0;z-index:50;background:rgba(6,7,10,.97);
    display:none;flex-direction:column}
  .ov.on{display:flex}
  .ov .bar{display:flex;gap:.5rem;align-items:center;padding:.5rem .7rem;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .ov .bar .t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;color:var(--mut)}
  .stage{flex:1;overflow:hidden;position:relative;touch-action:none}
  .stage img{position:absolute;left:50%;top:50%;transform-origin:center;
    max-width:none;user-select:none;-webkit-user-drag:none}

  /* ---- comparator ---- */
  .cmpwrap{flex:1;display:flex;min-height:0}
  .pane{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .pane:last-child{border-right:0}
  .pane .ph{display:flex;gap:.4rem;align-items:center;padding:.4rem .6rem;
    border-bottom:1px solid var(--line);font-size:.8rem;color:var(--mut)}
  .pane .ph .kp{margin-left:auto}
  .pane .stage{border:0}
  @media(max-width:640px){.cmpwrap{flex-direction:column}
    .pane{border-right:0;border-bottom:1px solid var(--line)}}

  .hint{color:var(--mut);font-size:.78rem}
  .tag{background:var(--chip);border:1px solid var(--line);border-radius:999px;
    padding:.15rem .5rem;font-size:.72rem;color:var(--mut)}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    padding:.5rem .9rem;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Galéria+</h1>
  <span class="count" id="count">…</span>
  <input type="search" id="q" placeholder="Hľadať názov / priečinok…" autocomplete="off">
  <span class="spacer"></span>
  <span class="qbox" title="Kvalita sťahovania (menšie JPEG)">
    ↓ q<input type="range" id="quality" min="30" max="100" step="5" value="70">
    <span class="qval" id="qval">70%</span>
  </span>
  <button id="cmpBtn">Porovnať</button>
</header>

<main>
  <div id="grid"></div>
  <div class="empty" id="empty" style="display:none">Žiadne položky.</div>
</main>

<!-- Single fullscreen viewer -->
<div class="ov" id="viewer">
  <div class="bar">
    <button id="vClose">✕</button>
    <span class="t" id="vTitle"></span>
    <button id="vFit">Prispôsobiť</button>
    <button id="vFull">1:1</button>
    <button class="pri" id="vDl">Stiahnuť</button>
  </div>
  <div class="stage" id="vStage"></div>
</div>

<!-- Comparator -->
<div class="ov" id="cmp">
  <div class="bar">
    <button id="cClose">✕</button>
    <span class="t">Porovnanie — vyber si, ktorú ponechať</span>
    <label class="hint"><input type="checkbox" id="cLink" checked> Zosynchronizovať priblíženie</label>
    <button id="cFit">Prispôsobiť obe</button>
  </div>
  <div class="cmpwrap">
    <div class="pane" data-i="0">
      <div class="ph"><span class="nm"></span><span class="kp"></span>
        <button class="keep pri">Ponechať túto</button>
        <button class="dl">Stiahnuť</button></div>
      <div class="stage"></div>
    </div>
    <div class="pane" data-i="1">
      <div class="ph"><span class="nm"></span><span class="kp"></span>
        <button class="keep pri">Ponechať túto</button>
        <button class="dl">Stiahnuť</button></div>
      <div class="stage"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
(function(){
  // ---- token: from URL (?token=) so every request can carry it ----
  var P = new URLSearchParams(location.search);
  var TOKEN = P.get("token") || "";
  function api(path, extra){
    var u = path + (path.indexOf("?")<0 ? "?" : "&") + "token=" + encodeURIComponent(TOKEN);
    return extra ? (u + "&" + extra) : u;
  }
  function isImage(m){ return (m||"").indexOf("image/")===0; }

  var $ = function(s,r){ return (r||document).querySelector(s); };
  var grid = $("#grid"), items = [], byId = {};
  var toastT;
  function toast(msg){
    var t=$("#toast"); t.textContent=msg; t.classList.add("on");
    clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("on");},1800);
  }

  // ------- quality slider -------
  var qEl=$("#quality"), qVal=$("#qval");
  function quality(){ return parseInt(qEl.value,10)||70; }
  qEl.addEventListener("input", function(){
    qVal.textContent=quality()+"%";
    try{ localStorage.setItem("gq", qEl.value); }catch(e){}
  });
  try{ var sq=localStorage.getItem("gq"); if(sq){ qEl.value=sq; qVal.textContent=sq+"%"; } }catch(e){}

  function fileUrl(id, reduced){
    // reduced download honours quality slider + caps long edge to 2048px
    return reduced ? api("/api/file", "id="+id+"&q="+quality()+"&max=2048")
                   : api("/api/file", "id="+id);
  }
  function download(it){
    var a=document.createElement("a");
    a.href=fileUrl(it.id, isImage(it.mime)); // videos: raw; images: reduced
    a.download=it.name;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Sťahujem "+it.name+(isImage(it.mime)?" ("+quality()+"%)":""));
  }

  // ------- lazy thumbnails -------
  var THUMB = 300; // px hint sent to /api/thumb (covers hi-dpi)
  var io = new IntersectionObserver(function(ents){
    ents.forEach(function(e){
      if(!e.isIntersecting) return;
      var img=e.target, id=img.dataset.id;
      img.src = api("/api/thumb", "id="+id+"&s="+THUMB);
      img.addEventListener("load", function(){ img.classList.add("on"); });
      img.addEventListener("error", function(){ img.classList.add("on"); img.style.opacity=.25; });
      io.unobserve(img);
    });
  }, {rootMargin:"400px"});

  function render(list){
    grid.textContent="";
    io.disconnect();
    if(!list.length){ $("#empty").style.display="block"; return; }
    $("#empty").style.display="none";
    var frag=document.createDocumentFragment();
    list.forEach(function(it){
      var c=document.createElement("div");
      c.className="cell"; c.dataset.id=it.id;
      var img=document.createElement("img");
      img.dataset.id=it.id; img.alt=it.name; img.loading="lazy";
      c.appendChild(img);
      if(!isImage(it.mime)){ var v=document.createElement("span"); v.className="vid"; v.textContent="▶ video"; c.appendChild(v); }
      var nm=document.createElement("span"); nm.className="nm"; nm.textContent=it.name; c.appendChild(nm);
      var b=document.createElement("span"); b.className="badge"; c.appendChild(b);
      c.addEventListener("click", function(){ onCell(it, c); });
      frag.appendChild(c);
      io.observe(img);
    });
    grid.appendChild(frag);
  }

  // ------- search filter -------
  var qInput=$("#q"), filterT;
  qInput.addEventListener("input", function(){
    clearTimeout(filterT);
    filterT=setTimeout(function(){
      var q=qInput.value.trim().toLowerCase();
      render(!q ? items : items.filter(function(it){
        return (it.name+" "+(it.relpath||it.bucket||"")).toLowerCase().indexOf(q)>=0;
      }));
    },160);
  });

  // ================= ZOOM/PAN engine (shared) =================
  // Attaches an <img> to a stage element with wheel-zoom, drag-pan, pinch, dblclick.
  function makeViewer(stage){
    var img=document.createElement("img");
    stage.textContent=""; stage.appendChild(img);
    var st={scale:1,x:0,y:0,nw:0,nh:0,fit:1,onchange:null};
    function apply(){
      img.style.transform="translate(-50%,-50%) translate("+st.x+"px,"+st.y+"px) scale("+st.scale+")";
    }
    function fit(){
      if(!st.nw){return;}
      var r=stage.getBoundingClientRect();
      st.fit=Math.min(r.width/st.nw, r.height/st.nh);
      if(!isFinite(st.fit)||st.fit<=0) st.fit=1;
      st.scale=st.fit; st.x=0; st.y=0; apply();
      if(st.onchange) st.onchange(st.scale);
    }
    function one(){ st.scale=1; st.x=0; st.y=0; apply(); if(st.onchange) st.onchange(st.scale); }
    img.addEventListener("load", function(){
      st.nw=img.naturalWidth; st.nh=img.naturalHeight; fit();
    });
    // wheel zoom toward cursor
    stage.addEventListener("wheel", function(e){
      e.preventDefault();
      var f=Math.exp(-e.deltaY*0.0015);
      zoomAt(e, st.scale*f);
    }, {passive:false});
    function zoomAt(e, ns){
      ns=Math.min(Math.max(ns, st.fit*0.5), 40);
      var r=stage.getBoundingClientRect();
      var cx=e.clientX-r.left-r.width/2, cy=e.clientY-r.top-r.height/2;
      // keep point under cursor stable
      st.x=cx-(cx-st.x)*(ns/st.scale);
      st.y=cy-(cy-st.y)*(ns/st.scale);
      st.scale=ns; apply();
      if(st.onchange) st.onchange(st.scale);
    }
    // drag pan
    var drag=null;
    stage.addEventListener("pointerdown", function(e){
      drag={x:e.clientX,y:e.clientY,ox:st.x,oy:st.y};
      stage.setPointerCapture(e.pointerId);
    });
    stage.addEventListener("pointermove", function(e){
      if(!drag)return;
      st.x=drag.ox+(e.clientX-drag.x); st.y=drag.oy+(e.clientY-drag.y); apply();
    });
    function endDrag(e){ drag=null; try{stage.releasePointerCapture(e.pointerId);}catch(_){} }
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);
    stage.addEventListener("dblclick", function(e){
      if(st.scale > st.fit*1.05){ fit(); } else { zoomAt(e, st.fit*2.5); }
    });
    return {
      el:img, st:st,
      load:function(src){ img.classList.remove("on"); img.src=src; },
      fit:fit, one:one,
      setScale:function(ns){ // used by sync-link; keep center
        ns=Math.min(Math.max(ns, st.fit*0.5),40); st.scale=ns; apply();
      }
    };
  }

  // ================= single viewer =================
  var viewer=$("#viewer"), vv=makeViewer($("#vStage")), vCur=null;
  function openViewer(it){
    vCur=it; $("#vTitle").textContent=it.relpath||it.name;
    var stage=$("#vStage");
    if(isImage(it.mime)){
      stage.style.display="";
      vv.load(fileUrl(it.id,false)); // full image, raw quality for viewing
    }else{
      // video -> use a <video> element instead of the zoom img
      stage.innerHTML="";
      var vid=document.createElement("video");
      vid.controls=true; vid.style.cssText="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:100%;max-height:100%";
      vid.src=fileUrl(it.id,false); stage.appendChild(vid);
    }
    viewer.classList.add("on");
  }
  $("#vClose").onclick=function(){ viewer.classList.remove("on"); $("#vStage").innerHTML=""; vv=makeViewer($("#vStage")); };
  $("#vFit").onclick=function(){ vv.fit(); };
  $("#vFull").onclick=function(){ vv.one(); };
  $("#vDl").onclick=function(){ if(vCur) download(vCur); };

  // ================= compare mode =================
  var cmpMode=false, sel=[], cmpBtn=$("#cmpBtn");
  function setCmpMode(on){
    cmpMode=on; document.body.classList.toggle("cmp",on);
    cmpBtn.classList.toggle("pri",on);
    cmpBtn.textContent = on ? "Zrušiť porovnanie ("+sel.length+"/2)" : "Porovnať";
    if(!on){ sel=[]; document.querySelectorAll(".cell.sel").forEach(function(c){c.classList.remove("sel");});
      refreshBadges(); }
  }
  cmpBtn.onclick=function(){ setCmpMode(!cmpMode); };

  function refreshBadges(){
    document.querySelectorAll(".cell").forEach(function(c){
      var i=sel.indexOf(c.dataset.id);
      var b=c.querySelector(".badge");
      if(i>=0){ c.classList.add("sel"); b.textContent=(i+1); } else { c.classList.remove("sel"); }
    });
    cmpBtn.textContent="Zrušiť porovnanie ("+sel.length+"/2)";
  }

  function onCell(it, cell){
    if(!cmpMode){ openViewer(it); return; }
    var id=String(it.id), k=sel.indexOf(id);
    if(k>=0){ sel.splice(k,1); }
    else{
      if(sel.length>=2) sel.shift();       // keep most recent two
      sel.push(id);
    }
    refreshBadges();
    if(sel.length===2) openCompare();
  }

  var cmp=$("#cmp"), panes=[$('.pane[data-i="0"]'),$('.pane[data-i="1"]')], pv=[null,null];
  function openCompare(){
    [0,1].forEach(function(i){
      var it=byId[sel[i]]; var pane=panes[i];
      pane.querySelector(".nm").textContent=it.relpath||it.name;
      // rebuild a fresh viewer per open (avoids stale listeners)
      pv[i]=makeViewer(pane.querySelector(".stage"));
      pv[i].st.onchange=function(sc){ syncFrom(i, sc); };
      pv[i].load(fileUrl(it.id,false));
      pane.querySelector(".kp").textContent="";
      pane.querySelector(".keep").onclick=function(){ decideKeep(i); };
      pane.querySelector(".dl").onclick=function(){ download(it); };
    });
    cmp.classList.add("on");
  }
  function syncFrom(i, sc){
    if(!$("#cLink").checked) return;
    var o=pv[1-i]; if(o){ o.setScale(sc); }
  }
  function decideKeep(i){
    var keep=byId[sel[i]], drop=byId[sel[1-i]];
    panes[i].querySelector(".kp").innerHTML='<span class="tag" style="color:var(--ok);border-color:var(--ok)">✓ ponechať</span>';
    panes[1-i].querySelector(".kp").innerHTML='<span class="tag" style="color:var(--danger);border-color:var(--danger)">vymazať v telefóne</span>';
    toast("Ponechať: "+keep.name+"  ·  Vymazať: "+drop.name);
    // NOTE: deletion is a phone-side action (MediaStore). Web view only recommends.
  }
  $("#cClose").onclick=function(){ cmp.classList.remove("on");
    panes.forEach(function(p){ p.querySelector(".stage").innerHTML=""; }); pv=[null,null]; };
  $("#cFit").onclick=function(){ pv.forEach(function(v){ if(v) v.fit(); }); };

  // esc closes overlays
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape"){
      if(cmp.classList.contains("on")) $("#cClose").click();
      else if(viewer.classList.contains("on")) $("#vClose").click();
    }
  });

  // ================= load list =================
  fetch(api("/api/list"))
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(data){
      items=data; byId={};
      items.forEach(function(it){ byId[String(it.id)]=it; });
      $("#count").textContent=items.length+" položiek";
      render(items);
    })
    .catch(function(err){
      $("#count").textContent="chyba";
      $("#empty").style.display="block";
      $("#empty").textContent="Nepodarilo sa načítať zoznam ("+err.message+"). Skontroluj token v URL.";
    });
})();
</script>
</body>
</html>
